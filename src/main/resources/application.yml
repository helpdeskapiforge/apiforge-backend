spring:
  application:
    name: API Forge

  # Datasource
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE}
      data-source-properties:
        ssl: ${DB_SSL}
        sslmode: ${DB_SSL_MODE}

  # JPA / Hibernate
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # "validate" (not "update"): schema changes are owned by Flyway migrations
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  # Flyway Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Web Error Handling
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

# Custom App Properties (Security / JWT / CORS)
app:
  jwtSecret: ${JWT_SECRET}
  jwtExpirationMs: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# AI Providers -- see README.md "AI Providers" for setup of each.
# Every value has a safe default so the app boots with zero AI config; the relevant
# provider is simply reported as unavailable (see AIProvider#isAvailable) until configured.
# Resolution order (first available wins) is controlled by ai.provider-priority.
ai:
  provider-priority: ${AI_PROVIDER_PRIORITY:ollama,lmstudio,openrouter,gemini}
  request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:90}
  max-prompt-chars: ${AI_MAX_PROMPT_CHARS:12000}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma3}
  lmstudio:
    base-url: ${LM_STUDIO_BASE_URL:http://localhost:1234}
    model: ${LM_STUDIO_MODEL:local-model}
  openrouter:
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:meta-llama/llama-3.1-8b-instruct:free}
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  rate-limit:
    max-requests: ${AI_RATE_LIMIT_MAX:20}
    window-seconds: ${AI_RATE_LIMIT_WINDOW_SECONDS:300}

# Actuator (health/info)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Logging
logging:
  level:
    root: INFO
    com.apiplatform: ${APP_LOG_LEVEL}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) [%thread] %logger{36} - %msg%n"