spring:
  application:
    name: API Forge

  # Datasource
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE}
      data-source-properties:
        ssl: ${DB_SSL}
        sslmode: ${DB_SSL_MODE}

  # JPA / Hibernate
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # "validate" (not "update"): schema changes are owned by Flyway migrations
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  # Flyway Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Web Error Handling
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never

# Custom App Properties (Security / JWT / CORS)
app:
  jwtSecret: ${JWT_SECRET}
  jwtExpirationMs: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Actuator (health/info)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Logging
logging:
  level:
    root: INFO
    com.apiplatform: ${APP_LOG_LEVEL}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) [%thread] %logger{36} - %msg%n"