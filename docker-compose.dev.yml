services:
  # ---------------------------------------------------------------------------
  # API Forge Backend
  # ---------------------------------------------------------------------------
  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        # Waits for the one-shot model download below to finish so the AI Tools
        # work correctly the first time you open the app -- not a hard requirement
        # (every AI endpoint degrades gracefully if Ollama isn't ready yet), but it
        # avoids a confusing "no provider available" moment on a fresh `docker compose up`.
        condition: service_completed_successfully
    ports:
      # Published to the host (not just `expose`) so a frontend running outside
      # Docker (e.g. `npm run dev` on your machine) can reach the API directly at
      # http://localhost:8080 with zero extra setup.
      - "8080:8080"
    environment:
      # Internal Docker routing (Safe to hardcode)
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-apiforge}

      # Credentials pulled from your uncommitted .env file (Secure)
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_SSL: "false"
      DB_SSL_MODE: disable

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}

      # --- AI Providers ---
      # `ollama` here is the Docker service name below, resolved via Docker's internal DNS --
      # NOT "localhost" (which inside this container would mean "this container", not your
      # host machine or the ollama container). This is the #1 cause of "AI Tools can't
      # connect" reports: the ollama server is real and running, just not reachable at
      # whatever OLLAMA_BASE_URL happened to be pointed at.
      AI_PROVIDER_PRIORITY: ${AI_PROVIDER_PRIORITY:-ollama,lmstudio,openrouter,gemini}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.1-8b-instruct:free}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-90}

  # ---------------------------------------------------------------------------
  # Local AI: Ollama server (free, runs entirely in this container -- no API key,
  # no external calls once the model below is pulled).
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      # Published to the host too, so `ollama pull <other-model>` / `ollama run gemma3`
      # from your own terminal (if you have the Ollama CLI installed) talks to this
      # same container instead of a separate local install.
      - "11434:11434"
    volumes:
      - apiforge_ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    # Uncomment to use an NVIDIA GPU if you have the NVIDIA Container Toolkit installed
    # (optional -- gemma3's default size runs fine on CPU, just slower):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot job: pulls the model once, then exits. `docker compose up` re-runs are
  # instant no-ops once the model is cached in the apiforge_ollama_models volume.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - apiforge_ollama_models:/root/.ollama
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-gemma3}"]

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Credentials pulled from your uncommitted .env file (Secure)
      POSTGRES_DB: ${DB_NAME:-apiforge}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - apiforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-apiforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apiforge_pgdata:
  apiforge_ollama_models: