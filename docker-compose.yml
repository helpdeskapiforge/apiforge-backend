services:
  # ---------------------------------------------------------------------------
  # Reverse Proxy (Entry Point)
  # ---------------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api

  # ---------------------------------------------------------------------------
  # API Forge Backend
  # ---------------------------------------------------------------------------
  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      # Internal Docker routing (Safe to hardcode)
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-apiforge}

      # Credentials pulled from your uncommitted .env file (Secure)
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_SSL: "false"
      DB_SSL_MODE: disable

      SERVER_SERVLET_CONTEXT_PATH: /api

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Credentials pulled from your uncommitted .env file (Secure)
      POSTGRES_DB: ${DB_NAME:-apiforge}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - apiforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-apiforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apiforge_pgdata: